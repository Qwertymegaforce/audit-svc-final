---

registry_host: ghcr.io
audit_svc_image_repo: ""
audit_svc_image_tag: ""
audit_svc_image: "{{ audit_svc_image_repo }}:{{ audit_svc_image_tag }}"

audit_network: audit
audit_data_dir: "{{ ansible_facts['user_dir'] }}/audit-svc-data"
audit_conf_dir: "{{ audit_data_dir }}/conf"
nginx_conf_dir: "{{ audit_data_dir }}/nginx"

postgres_image: postgres:17
postgres_container: postgres
postgres_volume: audit_pgdata
db_name: audit
db_user: audit_svc
postgres_password: "{{ vault_postgres_password }}"
audit_db_password: "{{ vault_audit_db_password }}"

nginx_image: nginx:1.27-alpine
nginx_port: 8088
exporter_image: nginx/nginx-prometheus-exporter:1.4
exporter_port: 9113
