---

- name: Deploy audit-svc
  hosts: deploy
  gather_facts: true

  tasks:
    - name: Release tag and image are given and we are not root
      ansible.builtin.assert:
        that:
          - audit_svc_image_tag | length > 0
          - audit_svc_image_repo | length > 0
          - ansible_facts['user_uid'] | int != 0
        fail_msg: >-
          Передайте образ и тег релиза (-e audit_svc_image_repo=ghcr.io/owner/audit-svc -e audit_svc_image_tag=vX.Y.Z)
          и запускайте плейбук не от root: контейнер сервиса работает с uid пользователя, который развёртывает.
        quiet: true

    - name: Secrets from vault.yml are available
      ansible.builtin.assert:
        that:
          - vault_postgres_password is defined
          - vault_audit_db_password is defined
        fail_msg: >-
          Нет переменных из vault.yml: проверьте, что файл inventories/prom/group_vars/all/vault.yml существует
          (deploy/init-secrets.sh) и что передан ключ --vault-password-file.
        quiet: true

    - name: Log in to the registry (credentials come from the CI environment)
      community.docker.docker_login:
        registry_url: "{{ registry_host }}"
        username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USER') }}"
        password: "{{ lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') }}"
      when: lookup('ansible.builtin.env', 'REGISTRY_USER') | length > 0
      no_log: "{{ not (show_secrets | default(false) | bool) }}"
      changed_when: false

    - name: Data directory exists
      ansible.builtin.file:
        path: "{{ audit_data_dir }}"
        state: directory

    - name: Config directory for the service
      ansible.builtin.file:
        path: "{{ audit_conf_dir }}"
        state: directory
        mode: "0750"

    - name: Config directory for Nginx
      ansible.builtin.file:
        path: "{{ nginx_conf_dir }}"
        state: directory
        mode: "0755"

    - name: Docker network (no ports are published from it)
      community.docker.docker_network:
        name: "{{ audit_network }}"

    - name: Named volume for PostgreSQL data
      community.docker.docker_volume:
        name: "{{ postgres_volume }}"

    - name: PostgreSQL container (no published ports)
      community.docker.docker_container:
        name: "{{ postgres_container }}"
        image: "{{ postgres_image }}"
        state: started
        restart_policy: unless-stopped
        env:
          POSTGRES_PASSWORD: "{{ postgres_password }}"
        volumes:
          - "{{ postgres_volume }}:/var/lib/postgresql/data"
        networks:
          - name: "{{ audit_network }}"
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Inspect PostgreSQL container
      community.docker.docker_container_info:
        name: "{{ postgres_container }}"
      register: postgres_info

    - name: Remember PostgreSQL address in the docker network
      ansible.builtin.set_fact:
        postgres_ip: "{{ postgres_info.container.NetworkSettings.Networks[audit_network].IPAddress }}"

    - name: Wait until PostgreSQL accepts connections
      community.postgresql.postgresql_ping:
        login_host: "{{ postgres_ip }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"
      register: postgres_ping
      until: postgres_ping.is_available | default(false)
      retries: 30
      delay: 2
      changed_when: false
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Role audit_svc (password is applied here, so a rotation shows up as changed)
      community.postgresql.postgresql_user:
        login_host: "{{ postgres_ip }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"
        name: "{{ db_user }}"
        password: "{{ audit_db_password }}"
        encrypted: true
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Database audit owned by audit_svc
      community.postgresql.postgresql_db:
        login_host: "{{ postgres_ip }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: config.yaml for the service
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ audit_conf_dir }}/config.yaml"
        mode: "0640"
      notify: Reload audit-svc
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Pull the release image
      community.docker.docker_image:
        name: "{{ audit_svc_image_repo }}"
        tag: "{{ audit_svc_image_tag }}"
        source: pull

    - name: Apply database migrations
      community.docker.docker_container:
        name: audit-svc-migrate
        image: "{{ audit_svc_image }}"
        command: ["migrate"]
        user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
        volumes:
          - "{{ audit_conf_dir }}:/etc/audit-svc:ro"
        networks:
          - name: "{{ audit_network }}"
        detach: false
        cleanup: true
        output_logs: true
        state: started
      register: migrate_result
      changed_when: "'applying ' in (migrate_result.container.Output | default(''))"
      failed_when: migrate_result.failed | default(false) or (migrate_result.status | default(0) | int) != 0

    - name: Show migration log
      ansible.builtin.debug:
        msg: "{{ (migrate_result.container.Output | default('')).splitlines() }}"

    - name: audit-svc container (no published ports)
      community.docker.docker_container:
        name: audit-svc
        image: "{{ audit_svc_image }}"
        image_name_mismatch: ignore
        state: started
        restart_policy: unless-stopped
        user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
        read_only: true
        cap_drop:
          - ALL
        volumes:
          - "{{ audit_conf_dir }}:/etc/audit-svc:ro"
        networks:
          - name: "{{ audit_network }}"

    - name: Inspect audit-svc container
      community.docker.docker_container_info:
        name: audit-svc
      register: audit_svc_info

    - name: Remember audit-svc address in the docker network
      ansible.builtin.set_fact:
        audit_svc_ip: "{{ audit_svc_info.container.NetworkSettings.Networks[audit_network].IPAddress }}"

    - name: Wait until audit-svc is healthy
      ansible.builtin.uri:
        url: "http://{{ audit_svc_ip }}:8080/healthz"
        use_proxy: false
      register: audit_svc_health
      until: audit_svc_health.status == 200
      retries: 30
      delay: 2
      changed_when: false

    - name: Nginx config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: "{{ nginx_conf_dir }}/default.conf"
        mode: "0644"
      notify: Reload nginx

    - name: Nginx container (the only published port of the stack, besides the exporter)
      community.docker.docker_container:
        name: nginx
        image: "{{ nginx_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ nginx_port }}:8080"
        volumes:
          - "{{ nginx_conf_dir }}:/etc/nginx/conf.d:ro"
        networks:
          - name: "{{ audit_network }}"

    - name: nginx-exporter container
      community.docker.docker_container:
        name: nginx-exporter
        image: "{{ exporter_image }}"
        state: started
        restart_policy: unless-stopped
        command:
          - "--nginx.scrape-uri=http://nginx:8081/stub_status"
        published_ports:
          - "{{ exporter_port }}:9113"
        networks:
          - name: "{{ audit_network }}"

    - name: Service answers through Nginx
      ansible.builtin.uri:
        url: "http://localhost:{{ nginx_port }}/healthz"
        use_proxy: false
      register: edge_health
      until: edge_health.status == 200
      retries: 15
      delay: 2
      changed_when: false

  handlers:
    - name: Reload audit-svc
      ansible.builtin.uri:
        url: "http://{{ audit_svc_ip }}:8080/reload"
        method: POST
        status_code: 200
        use_proxy: false
      register: reload_result

    - name: Reload nginx
      community.docker.docker_container_exec:
        container: nginx
        command: sh -c 'nginx -t && nginx -s reload'
